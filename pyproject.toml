[project]
name = "signalfield"
version = "0.1.0"
description = "Evidence-constrained multi-domain interest radar with adaptive search and verified citations"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
